<!doctype html>
<html lang="en">
<!--Voy a dejarme comentarios para explicarme a mi mismo mi cochinada -->
<!--El head es todo lo externo a la pagina como el logo, nombre de la pestaña y así-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario-Chan</title>
    <!--Link se usa para conectar con el archivo style.css que le dará estética a la página -->
    <link rel="stylesheet" href="style.css">
</head>
<!--Body es todo el cuerpo de la página, aquí se hace todo el contenido -->
<body>
    <!--form inicia un formulario, que al terminarlo me llevará a la página done.html -->
    <form action="done.html" method="get">
        <!--h1 sirve para titulos, h2 se usa para subtitulos y p me permite escribir texto -->
        <h1>Formulario-Chan</h1>
        <p>A continuación rellena con los datos que se te piden pibe</p>
        <!--ul sirve para iniciar una lista, cada linea se separa con li, es importante recordar poner texto y titulos dentro de cada li y no fuera -->
        <ul>
            <li>
                <h2>Identificación del alumno</h2> 
            </li>
            <li>
                <!--se pueden marcar los campos como obligatorios usando required -->
                <!-- se puede usar autocomplete para mostrar sugerencias según el campo-->
                <!--maxlength y minlength hacen lo que piensas que hacen -->
                <!--inputmode puede filtrar el tipo de dato que se va a ingresar, placeholder deja un texto de ejemplo en los campos -->
                <!-- placeholder sirve para poner texto dentro de los campos, útil para indicar cómo se insertan los datos -->
                <label for="name">Nombre completo:</label>
                <input type="text" required id="name" name="user_name" autocomplete="name" minlength= "5"  />
            </li>
            <li>
                <label for="rut">RUT chileno:</label>
                <div class="rut-container">
                    <input type="text" required id="rut" inputmode="numeric" name="user_rut" pattern="[0-9]*" placeholder="12345678" minlength="7" maxlength="8" class="input-rut"/>
                    <span class="separador">-</span>
                    <input type="text" required id="rut_dv" name="user_rut_dv" inputmode="text" placeholder="K" maxlength="1" class="input-rut-dv"/>
                </div>
            </li>
            <li>
                <label for="mail">Correo electrónico:</label>
                <input type="email" required id="mail" name="user_mail" autocomplete="email" placeholder="tu.correo@ejemplo.com" minlenght="5"  />
            </li>
            <li>
                <label for="phone">Teléfono:</label>
                <input type="tel" required id="phone" name="user_phone" autocomplete="tel" placeholder="+56912345678"  />
            </li>

            <li>
                <h2>Datos académicos</h2> 
            </li>
            <li>
                <!--select sirve para abrir una pestaña con distintas opciones, siempre dejar una opcion vacia para obligar al usuario a elegir -->
                <label for="career">Carrera/Programa:</label>
                <select id="career" name="user_career" required>
                    <option value="" disabled selected>Selecciona una opción...</option>
                    
                    <option value="Ing-informática">Ingeniería civil en informática</option>
                    <option value="Ing-minas">Ingeniería civil en minas</option>
                    <option value="Ing-aura">Ingeniería civil en aura</option>
                    <option value="Ing-comercial">Ingeniería comercial</option>
                </select>
            </li>
            <li>
                <!--Radio permite elegir entre distintas casillas de opciones y guardarlas bajo un mismo tipo de dato -->
                <!--Si se marca una, se desmarcan las otras -->
                <label for="jornada-diurna">
                    <input type="radio" id="jornada-diurna" name="jornada" value="diurna">Jornada diurna
                </label>
                
                <label for="jornada-vespertina">
                    <input type="radio" id="jornada-vespertina" name="jornada" value="vepestirna">Jornada vespertina
                </label>
            </li>
            <li>
                <label for="city">Sede o Ciudad:</label>
                <select id="city" name="user_city" required>
                    <option value="" disabled selected>Seleccione una opción...</option>

                    <option value="C-PM">Chinquihue-Puerto Montt</option>
                    <option value="PI-PM">Presidente Ibañez-Puerto Montt</option>
                    <option value="O">Osorno</option>
                    <option value="C">Chiloé</option>
                </select>
            </li>
            <li>
                <!--checkbox es util para casillas como las de aceptar terminos -->
                <label for="terms"> 
                    <input type="checkbox" id="terms" name="acepta_terminos" value="si" required>Acepto los términos y condiciones
                </label> 
            </li>
        </ul>
        <!--reset borra todos los campos rellenados -->
        <button type="reset">Borrar formulario</button>
        <!--submit finalmente envia el formulario -->
        <button type="submit">Enviar formulario</button>
    </form>
</body>
</html>
